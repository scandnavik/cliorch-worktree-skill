# cli-orchestrator Router Configuration
# A2-level Single-Operator AI Dev OS

routing:
  research: gemini
  code: codex
  debug: codex
  repo: copilot

allowed_clis:
  - gemini
  - codex
  - copilot

# Claude is DRIVER ONLY — never listed as worker CLI

policies:
  protected_paths:
    - "config/**"
    - "memory/**"
    - "plans/**"
    - "logs/**"
    - "outputs/**"
    - ".github/**"
    - "scripts/**"
    - ".env*"
    - "**/*secret*"

  deny_commands:
    - printenv
    - env
    - set
    - "curl|bash"
    - "wget|bash"
    - "base64 -d|sh"

  output_redaction_patterns:
    - "(api[_-]?key|secret|token|password)\\s*[:=]\\s*\\S+"

  non_bypassable_gates:
    - secrets
    - ci
    - auth
    - network

  copilot_requires_patch: true
  copilot_freeform: false
  max_steps: 8
  max_files_changed: 50
  max_attempts_per_step: 2
  max_wall_time_sec: 900
  max_budget_usd: 2
