# user-defined multi-model orchestration strategies

strategies:
  default:
    description: "標準的全能開發流程"
    manager: 
      cli: claude
      model: claude-opus-4-6
    flow:
      - ideation
      - converge
      - execution
      - review
    roles:
      ideation: 
        cli: gemini
        model: gemini-3.1-pro-preview
      execution: 
        cli: codex
        model: gpt-5.2
      review:
        cli: codex
        model: gpt-5.2
      version_control: 
        cli: copilot
        model: copilot-default

  fast_code:
    description: "跳過發想，只做快速純代碼修正"
    manager: 
      cli: codex
      model: gpt-5 mini
    flow:
      - execution
      - review
    roles:
      execution:
        cli: codex
        model: gpt-5 mini
      review:
        cli: codex
        model: gpt-5 mini

  claude_only:
    description: "純 Claude 執行策略，不依賴外部模型"
    manager:
      cli: claude
      model: claude-sonnet-4-6
    flow:
      - execution
      - review
    roles:
      execution:
        cli: claude
        model: claude-haiku-4-5-20251001
      review:
        cli: claude
        model: claude-haiku-4-5-20251001

  claude_gemini_copilot_codex:
    description: "Claude 發起 -> Gemini 發散 -> 收斂 -> Copilot 開發 -> Codex Review"
    manager:
      cli: claude
      model: claude-opus-4-6
    flow:
      - ideation
      - converge
      - execution
      - review
    roles:
      ideation:
        cli: gemini
        model: gemini-3.1-pro-preview
      execution:
        cli: copilot
        model: copilot-default
      review:
        cli: codex
        model: gpt-5.2
